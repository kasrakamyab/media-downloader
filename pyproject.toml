[project]
name = "media-bot"
version = "0.1.0"
description = "Telegram bot that downloads YouTube, Instagram and Pinterest media"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "arq>=0.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "redis>=5.0",
    # [default] pulls in yt-dlp-ejs, the YouTube challenge-solver scripts (needs deno).
    "yt-dlp[default]>=2025.11",
    # yt-dlp plugin: fetches YouTube PO tokens from the bgutil sidecar (docker-compose.yml),
    # which is what clears "Sign in to confirm you're not a bot" without an account.
    "bgutil-ytdlp-pot-provider>=2.0",
    "gallery-dl>=1.27",
    "aiohttp-socks>=0.9",  # socks5:// support for TELEGRAM_PROXY
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "fakeredis>=2.23",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "gateway*", "workers*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
