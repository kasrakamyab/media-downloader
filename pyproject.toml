[project]
name = "media-bot"
version = "0.1.0"
description = "Telegram bot that downloads YouTube, Instagram and Pinterest media"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "arq>=0.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "redis>=5.0",
    "yt-dlp>=2024.8",
    "gallery-dl>=1.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "fakeredis>=2.23",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "gateway*", "workers*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
