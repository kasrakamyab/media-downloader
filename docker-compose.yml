# Dev and prod use this same file; deploy/compose.prod.yml layers restart policies and
# log rotation on top. Scale a worker with: docker compose up -d --scale worker-youtube=2
# Large files (>50 MB) need the self-hosted Bot API server: docker compose --profile bigfiles up

x-service: &service
  build: .
  image: ${IMAGE:-media-bot:local}
  env_file: .env
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy

x-worker-health: &worker-health
  test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8081/health', timeout=3)"]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 20s

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "100mb", "--maxmemory-policy", "allkeys-lru", "--save", "600", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m

  gateway:
    <<: *service
    command: ["python", "-m", "gateway.main"]
    environment:
      REDIS_URL: redis://redis:6379/0
      NO_PROXY: localhost,127.0.0.1,redis,telegram-bot-api
      no_proxy: localhost,127.0.0.1,redis,telegram-bot-api
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 256m

  # Generates YouTube proof-of-origin tokens for yt-dlp (bgutil plugin). This is what gets
  # past "Sign in to confirm you're not a bot" without any Google account or cookies.
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2-deno
    restart: unless-stopped
    environment:
      # The provider fetches from YouTube itself, so it needs the same proxy as the worker.
      HTTPS_PROXY: ${DOWNLOAD_PROXY:-}
      HTTP_PROXY: ${DOWNLOAD_PROXY:-}
    expose:
      - "4416"
    mem_limit: 256m

  worker-youtube:
    <<: *service
    command: ["arq", "workers.youtube.worker.WorkerSettings"]
    environment:
      REDIS_URL: redis://redis:6379/0
      NO_PROXY: localhost,127.0.0.1,redis,telegram-bot-api,pot-provider
      no_proxy: localhost,127.0.0.1,redis,telegram-bot-api,pot-provider
      WORKER_CONCURRENCY: ${YT_CONCURRENCY:-3}
      POT_PROVIDER_URL: ${POT_PROVIDER_URL:-http://pot-provider:4416}
    depends_on:
      redis:
        condition: service_healthy
      pot-provider:
        condition: service_started
    volumes:
      - ./secrets:/secrets:ro
    healthcheck: *worker-health
    mem_limit: 512m

  worker-instagram:
    <<: *service
    command: ["arq", "workers.instagram.worker.WorkerSettings"]
    environment:
      REDIS_URL: redis://redis:6379/0
      NO_PROXY: localhost,127.0.0.1,redis,telegram-bot-api
      no_proxy: localhost,127.0.0.1,redis,telegram-bot-api
      WORKER_CONCURRENCY: ${IG_CONCURRENCY:-4}
    volumes:
      - ./secrets:/secrets:ro
    healthcheck: *worker-health
    mem_limit: 384m

  worker-pinterest:
    <<: *service
    command: ["arq", "workers.pinterest.worker.WorkerSettings"]
    environment:
      REDIS_URL: redis://redis:6379/0
      NO_PROXY: localhost,127.0.0.1,redis,telegram-bot-api
      no_proxy: localhost,127.0.0.1,redis,telegram-bot-api
      WORKER_CONCURRENCY: ${PIN_CONCURRENCY:-4}
    volumes:
      - ./secrets:/secrets:ro
    healthcheck: *worker-health
    mem_limit: 256m

  # Step 9: self-hosted Bot API server lifts the upload cap from 50 MB to 2 GB.
  # Needs TELEGRAM_API_ID / TELEGRAM_API_HASH from https://my.telegram.org and
  # TELEGRAM_API_URL=http://telegram-bot-api:8081 in .env. See docs/deploy.md.
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    profiles: ["bigfiles"]
    environment:
      # Compose interpolates these even when the profile is off, so no `:?` here; the
      # image itself refuses to start without them.
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: "1"
    volumes:
      - bot-api-data:/var/lib/telegram-bot-api
    mem_limit: 256m

volumes:
  redis-data:
  bot-api-data:
