# Production overlay. Usage on the VPS (IMAGE points at the registry image, see deploy.yml):
#   docker compose -f docker-compose.yml -f deploy/compose.prod.yml pull
#   docker compose -f docker-compose.yml -f deploy/compose.prod.yml up -d
# Gateway runs in webhook mode; Caddy terminates TLS and proxies /webhook to it.

x-prod: &prod
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  redis:
    <<: *prod
  gateway:
    <<: *prod
    build: !reset null
    environment:
      REDIS_URL: redis://redis:6379/0
      MODE: webhook
      LOG_JSON: "true"
    ports: !reset []
    expose:
      - "8080"
  worker-youtube:
    <<: *prod
    build: !reset null
    environment:
      REDIS_URL: redis://redis:6379/0
      WORKER_CONCURRENCY: ${YT_CONCURRENCY:-2}
      LOG_JSON: "true"
  worker-instagram:
    <<: *prod
    build: !reset null
    environment:
      REDIS_URL: redis://redis:6379/0
      WORKER_CONCURRENCY: ${IG_CONCURRENCY:-4}
      LOG_JSON: "true"
  worker-pinterest:
    <<: *prod
    build: !reset null
    environment:
      REDIS_URL: redis://redis:6379/0
      WORKER_CONCURRENCY: ${PIN_CONCURRENCY:-4}
      LOG_JSON: "true"

  caddy:
    <<: *prod
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - gateway

volumes:
  caddy-data:
